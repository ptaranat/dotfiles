# Repos chezmoi clones and keeps updated, replacing former git submodules:
# fetched on apply rather than pinned to a SHA committed here.

# Private work config, kept out of this public repo. .zshrc globs
# $ZDOTDIR/work/*.zsh after rc.d so it can override; machines without access skip it.
[".config/zsh/work"]
    type = "git-repo"
    url = "git@github.com:ptaranat/work.git"
    refreshPeriod = "168h"

# Ghostty cursor shaders.
[".config/ghostty/shaders"]
    type = "git-repo"
    url = "https://github.com/sahaj-b/ghostty-cursor-shaders.git"
    refreshPeriod = "720h"

# znap, the zsh plugin manager. .zshrc sources znap.zsh from here, so without it
# a fresh machine gets no plugins and no prompt.
[".local/share/znap/zsh-snap"]
    type = "git-repo"
    url = "https://github.com/marlonrichert/zsh-snap.git"
    refreshPeriod = "168h"
