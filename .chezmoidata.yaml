# Every apt name must exist on Debian trixie and every pacman name in the Arch
# repos, or the install fails.

packages:
  apt:
    core:
      - zsh
      - git
      - git-delta
      - tmux
      # tmux-256color terminfo; tmux fails to start without it.
      - ncurses-term
      - curl
      - wget
      - unzip
      - build-essential
      - gnupg
      - locales
      # bwrap for Claude Code sandbox; brew autoremove drops it.
      - bubblewrap

    tools:
      - ripgrep
      - fd-find
      - bat
      - eza
      - fzf
      - zoxide
      - jq
      - shellcheck
      - just
      - glow
      - micro
      - tealdeer
      - mosh
      - httpie
      - hyperfine
      # Not brew: brew's awscli pulls a python mise cannot see.
      - awscli

  # Overrides apt: keep shell deps in both or fresh boxes break.
  brew:
    linux:
      # apt has 0.10.4; the nvim config needs >= 0.11.
      - neovim
      - gh
      - ripgrep
      - just
      - fzf

  # Not packaged for apt: mise (mise.run), sesh (GitHub release, tmux needs it).

  # Arch covers the apt and brew.linux lists in one place, mise included.
  pacman:
    core:
      - zsh
      - git
      - git-delta
      - git-lfs
      - tmux
      - ncurses
      - curl
      - wget
      - unzip
      - base-devel
      - gnupg
      # /usr/bin/pinentry picks qt, gtk or curses from the session.
      - pinentry
      - openssh
      - bubblewrap
      - chezmoi
      - mise

    tools:
      - neovim
      - github-cli
      - ripgrep
      - fd
      - bat
      - eza
      - fzf
      - zoxide
      - atuin
      - jq
      - shellcheck
      - just
      - glow
      - micro
      - tealdeer
      - mosh
      - httpie
      - hyperfine
      - aws-cli-v2
      - dos2unix
      - wl-clipboard
      - ttf-meslo-nerd

    # Installed only when paru or yay is present.
    aur:
      - sesh-bin
