# Every apt name must exist on Debian trixie or apt-get fails.

packages:
  apt:
    core:
      - zsh
      - git
      - git-delta
      - tmux
      # tmux-256color terminfo; tmux fails to start without it.
      - ncurses-term
      - curl
      - wget
      - unzip
      - build-essential
      - gnupg
      - locales
      # bwrap for Claude Code sandbox; brew autoremove drops it.
      - bubblewrap

    tools:
      - ripgrep
      - fd-find
      - bat
      - eza
      - fzf
      - zoxide
      - jq
      - shellcheck
      - just
      - glow
      - tealdeer
      - mosh
      - httpie
      - hyperfine
      # Not brew: brew's awscli pulls a python mise cannot see.
      - awscli

  # Overrides apt: keep shell deps in both or fresh boxes break.
  brew:
    linux:
      # apt has 0.10.4; the nvim config needs >= 0.11.
      - neovim
      - gh
      - ripgrep
      - just
      - fzf

  # Not packaged: mise (mise.run), sesh (GitHub release, tmux needs it).
