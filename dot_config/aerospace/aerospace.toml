# AeroSpace. Reference: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

after-startup-command = []
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
# 'auto': wide monitors get horizontal, tall monitors vertical.
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Kept alive even when empty and invisible.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]

on-mode-changed = []
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 6
gaps.inner.vertical =   6
gaps.outer.left =       6
gaps.outer.bottom =     6
gaps.outer.top =        6
gaps.outer.right =      6

[mode.main.binding]

    # The pgrep pattern must be the bundle path including Contents/MacOS.
    # `pgrep -x ghostty` cannot match (macOS truncates process names to 16
    # chars), and a looser `pgrep -f Ghostty.app` matches every process launched
    # from a Ghostty terminal via the inherited GHOSTTY_RESOURCES_DIR.
    alt-enter = '''exec-and-forget pgrep -f "Ghostty.app/Contents/MacOS" >/dev/null \
      && osascript -e 'tell application "System Events" to tell process "ghostty" to click menu item "New Window" of menu "File" of menu bar 1' \
      || open -a "/Applications/Ghostty.app"'''
    # Drives File > New Window directly: `open -na Helium` hands off to the
    # existing instance (Chromium is single-instance), which then opens the
    # window in whatever workspace it was last used in.
    alt-w = '''exec-and-forget osascript \
      -e 'if application "Helium" is running then' \
      -e 'tell application "System Events" to tell process "Helium" to click menu item "New Window" of menu "File" of menu bar 1' \
      -e 'else' \
      -e 'tell application "Helium" to activate' \
      -e 'end if' '''
    alt-shift-f = 'macos-native-fullscreen'

    # Rewrites the gaps values in this file; auto-reload-config applies them.
    alt-shift-z = 'exec-and-forget /Users/panat/.config/aerospace/toggle-zen.sh'

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 0'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 0'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# Float rules, ported from yabai 'manage=off'.

# Finder dialogs only, not Finder windows.
[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Co(py|nnect)|Move|Info|Pref'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Dictionary'
run = 'layout floating'

[[on-window-detected]]
if.window-title-regex-substring = 'Software Update'
run = 'layout floating'

# About This Mac
[[on-window-detected]]
if.app-id = 'com.apple.SystemProfiler'
run = 'layout floating'
