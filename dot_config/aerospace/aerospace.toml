config-version = 2

after-startup-command = []

start-at-login = true

auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]

on-mode-changed = []

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

# Gaps between windows (inner-*) and monitor edges (outer-*).
gaps.inner.horizontal = 12
gaps.inner.vertical =   12
gaps.outer.left =       12
gaps.outer.bottom =     12
gaps.outer.top =        12
gaps.outer.right =      12

[mode.main.binding]

    # pgrep matches the bundle path, not the process name: macOS truncates
    # process names to 16 chars, so `pgrep -x ghostty` never matched and every
    # press fell through to `open`, focusing the existing window. Contents/MacOS
    # is required; a looser `-f Ghostty.app` also matches processes launched
    # from a Ghostty terminal via the inherited GHOSTTY_RESOURCES_DIR.
    alt-enter = '''exec-and-forget pgrep -f "Ghostty.app/Contents/MacOS" >/dev/null \
      && osascript -e 'tell application "System Events" to tell process "ghostty" to click menu item "New Window" of menu "File" of menu bar 1' \
      || open -a "/Applications/Ghostty.app"'''
    # Chromium is single-instance, so `open -na Helium` handed off to the
    # running process and macOS activated it wherever it last lived, not in the
    # focused workspace. Drive its own File > New Window instead.
    alt-w = '''exec-and-forget osascript \
      -e 'if application "Helium" is running then' \
      -e 'tell application "System Events" to tell process "Helium" to click menu item "New Window" of menu "File" of menu bar 1' \
      -e 'else' \
      -e 'tell application "Helium" to activate' \
      -e 'end if' '''
    alt-shift-f = 'macos-native-fullscreen'

    # Toggle big outer gaps to show the wallpaper. The script rewrites the gaps
    # values in this file; auto-reload-config applies them.
    alt-shift-z = 'exec-and-forget /Users/panat/.config/aerospace/toggle-zen.sh'

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 0'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 0'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# Float rules, ported from yabai 'manage=off'.

# Finder dialogs only (Copy/Connect/Move/Info/Preferences), not Finder windows
[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Co(py|nnect)|Move|Info|Pref'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Dictionary'
run = 'layout floating'

[[on-window-detected]]
if.window-title-regex-substring = 'Software Update'
run = 'layout floating'

# About This Mac
[[on-window-detected]]
if.app-id = 'com.apple.SystemProfiler'
run = 'layout floating'
