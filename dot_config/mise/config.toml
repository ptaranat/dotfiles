[tools]
node = "24"
python = "3.13"
# Global so completions can be generated outside a project.
pnpm = "11"
# Global: its CLIs use `env bun`; a project pin breaks them elsewhere.
bun = "1.3"
aube = "1"
# Here, not the Brewfile: nvim needs it on Linux too.
tree-sitter = "0.26"

[settings]
lockfile = true

python.uv_venv_auto = "create|source"

idiomatic_version_file_enable_tools = ["node", "python"]

auto_install = true

env_cache = true

[settings.status]
missing_tools = "always"

[settings.ruby]
compile = false

[tasks.docs-publish]
description = "Build the Dungeon Books vault site and publish it to kurokami"
dir = "~/projects/dungeonbooks/quartz"
run = "mise exec -- ./docs-publish"

[tasks.docs-publish-dry]
description = "Build the vault site and show what would change on kurokami"
dir = "~/projects/dungeonbooks/quartz"
run = "mise exec -- ./docs-publish --dry-run"
