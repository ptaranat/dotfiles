# mise: runtime version manager. mise owns interpreter versions, uv owns Python
# packages and venvs; mise defers to uv for venv creation when uv is installed.

[tools]
node = "24"
python = "3.13"
# Global so it resolves outside a project and completions can be generated;
# projects pinning their own version still win.
pnpm = "11"
# Pinned to major, not "latest", so it cannot change under a project mid-work.
aube = "1"
# For luarocks; nvim bundles its own LuaJIT.
lua = "5.4"

[settings]
# Write mise.lock so projects pin exact builds, not whatever "24" resolves to today.
lockfile = true

# Auto-create and source .venv for any project with a uv.lock.
python.uv_venv_auto = "create|source"

# Also honour .nvmrc / .node-version / .python-version. Opt-in per tool.
idiomatic_version_file_enable_tools = ["node", "python"]

auto_install = true

# Speeds up nested mise invocations; invalidates when a config file changes.
env_cache = true

[settings.status]
# Warn on missing tools instead of silently using the wrong version.
missing_tools = "always"
