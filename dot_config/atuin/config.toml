# Back up ~/.local/share/atuin/key; synced history needs it.
auto_sync = false
update_check = false

search_mode = "fuzzy"
filter_mode = "global"

filter_mode_shell_up_key_binding = "directory"

style = "compact"
inline_height = 20
show_preview = true

history_filter = [
  "^ ",           # leading space, the usual "do not record this" convention
  "^atuin search",
]

secrets_filter = true

[stats]
common_prefix = ["sudo", "time", "uv", "mise"]
