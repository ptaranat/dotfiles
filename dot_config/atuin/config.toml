# Atuin: SQLite-backed shell history, bound to Ctrl-R. To sync across machines,
# `atuin register` then `atuin sync`. Synced history is encrypted with the key at
# ~/.local/share/atuin/key; back it up, it is the only way to decrypt.
auto_sync = false
update_check = false

# Global matches the old Ctrl-R behaviour most closely.
search_mode = "fuzzy"
filter_mode = "global"

# Holding Ctrl-R cycles filter modes; start from the current directory.
filter_mode_shell_up_key_binding = "directory"

# Compact inline UI rather than taking over the whole terminal.
style = "compact"
inline_height = 20
show_preview = true

# Commands not worth recording.
history_filter = [
  "^ ",           # leading space, the usual "do not record this" convention
  "^atuin search",
]

# Do not record secrets that get typed as arguments.
secrets_filter = true

[stats]
common_prefix = ["sudo", "time", "uv", "mise"]
