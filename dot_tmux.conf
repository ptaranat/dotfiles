# Needs the tmux-256color terminfo (ncurses-term on Debian).
set -g default-terminal tmux-256color

set-option -g status-position bottom

set -g detach-on-destroy on

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -sg escape-time 0

set -g mouse on

set -as terminal-features ",*:hyperlinks"

# RGB per outer terminal; WSL sets no COLORTERM to infer it from.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-kitty:RGB"

set -g extended-keys "on"
set -g extended-keys-format "csi-u"

set -s focus-events "on"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g automatic-rename on
set -g set-titles on

bind-key v split-window -h
bind-key s split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key S choose-session
set-window-option -g mode-keys vi

bind-key X confirm-before kill-session
bind-key x kill-pane
bind-key & kill-window
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'srcery-colors/srcery-tmux'
set -g @srcery_tmux_patched_font '1'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Return to the session `tm <name>` asked for, not the saved one.
set -g @resurrect-hook-post-restore-all 'target="$(tmux show-option -gqv @tm-target)"; if [ -n "$target" ]; then tmux switch-client -t "$target"; tmux set-option -gu @tm-target; fi'

set-hook -g session-closed 'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh"'

run '~/.tmux/plugins/tpm/tpm'
