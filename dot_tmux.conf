# tmux-256color is the terminfo that actually describes tmux; xterm-256color
# misreports capabilities (notably italics) to programs in the panes.
set -g default-terminal tmux-256color

# tmux-256color does not advertise Tc/RGB itself, so truecolor is stated
# separately. Keyed on the OUTER terminal's name, so each one needs listing;
# -as rather than -g keeps tmux's built-in feature table.
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-kitty:RGB"

# Status on top
set-option -g status-position bottom

# Kill on quit
set -g detach-on-destroy on

# Set C-a as prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# No delay esc
set -sg escape-time 0

# Mouse mode
set -g mouse on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Windows
setw -g automatic-rename on
set -g set-titles on

# Use vim-like keys for splits and windows
bind-key v split-window -h
bind-key s split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key S choose-session
set-window-option -g mode-keys vi

# Keybindings
bind-key X confirm-before kill-session
bind-key x kill-pane
bind-key & kill-window
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'srcery-colors/srcery-tmux'
set -g @srcery_tmux_patched_font '1'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Persist sessions across restarts. A tmux server does not survive its binary
# being replaced, and upgrading under a running server strands the sessions;
# with these that costs at most fifteen minutes of layout.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Save scrollback too, not just which programs were running.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
